<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Vendhan InfoTech</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4f46e5;--accent-light:#eef2ff;
    --surface:#fff;--bg:#f4f6fb;--border:#e5e7eb;
    --text-primary:#111827;--text-secondary:#6b7280;--text-muted:#9ca3af;
    --danger:#dc2626;--danger-bg:#fef2f2;
    --success:#059669;--success-bg:#ecfdf5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:40px 36px;width:420px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.06);
  }
  .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;}
  .logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:17px;}
  .logo-sub{font-size:11.5px;color:var(--text-muted);}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:21px;font-weight:700;margin-bottom:6px;}
  .sub{font-size:13.5px;color:var(--text-secondary);margin-bottom:26px;}

  .role-tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:24px;}
  .role-tab{flex:1;padding:9px;border-radius:8px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text-secondary);transition:all .15s;}
  .role-tab.active{background:var(--accent);color:#fff;}

  .form-group{margin-bottom:16px;}
  label{font-size:12.5px;font-weight:600;color:var(--text-primary);display:block;margin-bottom:6px;}
  .input-wrap{position:relative;}
  input[type=email],input[type=password],input[type=text]{
    width:100%;height:44px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;
    font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
  .toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-muted);}

  .error-box{background:var(--danger-bg);border:1px solid #fecaca;border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--danger);margin-bottom:16px;display:none;align-items:flex-start;gap:8px;}
  .error-box.show{display:flex;}

  .btn-submit{
    width:100%;height:46px;background:var(--accent);color:#fff;border:none;border-radius:10px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
  }
  .btn-submit:hover{background:#4338ca;}
  .btn-submit:disabled{opacity:.6;cursor:not-allowed;}

  .hint-box{background:var(--accent-light);border:1px solid #c7d2fe;border-radius:10px;padding:11px 14px;font-size:12px;color:var(--accent);margin-top:18px;line-height:1.5;}

  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-row">
    <div class="logo-icon">V</div>
    <div><div class="logo-text">Vendhan InfoTech</div><div class="logo-sub">HRMS Portal</div></div>
  </div>

  <h1>Welcome back</h1>
  <div class="sub">Sign in to continue to your portal</div>

  <div class="role-tabs">
    <button class="role-tab active" id="tabEmployee" onclick="switchRole('employee')">🧑‍💼 Employee</button>
    <button class="role-tab" id="tabAdmin" onclick="switchRole('admin')">🔑 Admin</button>
  </div>

  <div class="error-box" id="errorBox"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@vendhan.com" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <div class="input-wrap">
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
        <button type="button" class="toggle-pass" onclick="togglePassword()">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">
      <div class="spinner" id="spinner"></div>
      <span id="submitLabel">Sign In</span>
    </button>
  </form>

  <div class="hint-box" id="hintBox">
    🧑‍💼 Use the email and password your admin set for you in Employee Management.
  </div>
</div>

<script>
const SESSION_KEY = 'vendhan_session';
const API_URL = 'https://vendhan-backend.onrender.com';

let currentRole = 'employee';

function switchRole(role) {
  currentRole = role;
  document.getElementById('tabEmployee').classList.toggle('active', role === 'employee');
  document.getElementById('tabAdmin').classList.toggle('active', role === 'admin');
  document.getElementById('hintBox').innerHTML = role === 'employee'
    ? '🧑\u200d💼 Use the email and password your admin set for you in Employee Management.'
    : '🔑 Use a registered admin email and password.';
  hideError();
}

function togglePassword() {
  const field = document.getElementById('loginPassword');
  const btn = document.querySelector('.toggle-pass');
  field.type = field.type === 'password' ? 'text' : 'password';
  btn.textContent = field.type === 'password' ? '👁' : '🙈';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠️ ' + msg;
  box.classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

function setLoading(loading) {
  document.getElementById('submitBtn').disabled = loading;
  document.getElementById('spinner').style.display = loading ? 'block' : 'none';
  document.getElementById('submitLabel').textContent = loading ? 'Signing in...' : 'Sign In';
}

async function handleLogin(event) {
  event.preventDefault();
  hideError();

  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) { showError('Please enter both email and password.'); return; }

  setLoading(true);

  try {
    const response = await fetch(`${API_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (!response.ok) {
      showError(data.error || 'Login failed. Please try again.');
      setLoading(false);
      return;
    }

    if (data.user.role !== currentRole) {
      showError(`This account is registered as ${data.user.role}, not ${currentRole}. Please switch tabs.`);
      setLoading(false);
      return;
    }

    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      role: data.user.role,
      email: data.user.email,
      employeeId: data.user.employeeId,
      userId: data.user.id,
      name: data.user.full_name,
      token: data.token,
      loggedInAt: Date.now()
    }));

    setLoading(false);
    window.location.href = currentRole === 'admin'
      ? 'admin/dashboard.html'
      : 'employee/emp_dashboard.html';

  } catch (err) {
    console.error(err);
    showError('Could not connect to server. Please try again.');
    setLoading(false);
  }
}
</script>
</body>
</html>
