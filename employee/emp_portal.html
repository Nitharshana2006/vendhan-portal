<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Portal — Vendhan InfoTech</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--a:#4f46e5;--al:#eef2ff;--bg:#f4f6fb;--s:#fff;--b:#e5e7eb;--t:#111827;--ts:#6b7280;--tm:#9ca3af;--ok:#059669;--okb:#ecfdf5;--w:#d97706;--wb:#fffbeb;--r:#dc2626;--rb:#fef2f2;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);display:flex;height:100vh;overflow:hidden;}
.sb{width:220px;background:#0f172a;display:flex;flex-direction:column;flex-shrink:0;}
.sb-logo{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);}
.li{width:32px;height:32px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0;}
.lt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;color:#fff;}
.ls{font-size:10px;color:rgba(255,255,255,.4);}
.sb-nav{flex:1;padding:8px;overflow-y:auto;}
.nb{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:all .15s;margin-bottom:1px;}
.nb:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
.nb.on{background:rgba(99,102,241,.2);color:#a5b4fc;}
.sb-ft{padding:10px 8px;border-top:1px solid rgba(255,255,255,.06);}
.uc{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.05);border-radius:7px;}
.ua{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.un{font-size:12px;font-weight:600;color:#fff;}
.ui{font-size:10px;color:rgba(255,255,255,.4);}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.tb{background:var(--s);border-bottom:1px solid var(--b);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.tt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;}
.ts{font-size:11.5px;color:var(--tm);margin-top:2px;}
.mn{flex:1;overflow-y:auto;padding:24px;}
.sec{display:none;}.sec.on{display:block;}
.em{background:var(--s);border:1px dashed var(--b);border-radius:14px;padding:44px 24px;text-align:center;max-width:420px;margin:20px auto 0;}
.ei{font-size:36px;margin-bottom:10px;}
.et{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;margin-bottom:6px;}
.ed{font-size:12.5px;color:var(--tm);line-height:1.6;}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px;}
.ct{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;margin-bottom:14px;}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;display:inline-flex;align-items:center;gap:7px;}
.bp{background:var(--a);color:#fff;}.bp:hover{background:#4338ca;}.bp:disabled{opacity:.55;cursor:not-allowed;}
.bs{background:var(--ok);color:#fff;}
.bo{background:var(--s);color:var(--ts);border:1px solid var(--b);}.bo:hover{border-color:var(--r);color:var(--r);}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:4px;width:fit-content;margin-bottom:16px;}
.tab{padding:7px 16px;border-radius:7px;border:none;background:none;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ts);}
.tab.on{background:var(--a);color:#fff;}
.pnl{display:none;}.pnl.on{display:block;}
.dz{border:2px dashed var(--b);border-radius:12px;padding:32px;text-align:center;background:var(--bg);cursor:pointer;position:relative;transition:all .2s;}
.dz:hover,.dz.ov{border-color:var(--a);background:var(--al);}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
textarea.pt{width:100%;height:140px;border:1px solid var(--b);border-radius:8px;padding:12px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;}
textarea.pt:focus{border-color:var(--a);}
.fc{display:none;margin-top:10px;padding:9px 13px;background:var(--okb);border:1px solid #a7f3d0;border-radius:8px;font-size:12.5px;color:var(--ok);align-items:center;gap:7px;}
.ip{max-width:100%;border-radius:8px;margin-top:10px;display:none;}
.pc{background:linear-gradient(135deg,#312e81,#4f46e5);border-radius:12px;padding:20px;text-align:center;color:#fff;display:none;margin:12px 0;}
.pc.on{display:block;}
.sp{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px;}
@keyframes sp{to{transform:rotate(360deg);}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.fl{font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.fi{border:1.5px solid var(--b);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;width:100%;}
.fi:focus{border-color:var(--a);}
textarea.fi{min-height:80px;resize:vertical;}
.sr{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bg);font-size:12.5px;}
.sr:last-child{border-bottom:none;}
.pl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;}
.pp{background:var(--wb);color:var(--w);}
.pr{background:var(--okb);color:var(--ok);}
.ir{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bg);font-size:13px;}
.ir:last-child{border-bottom:none;}
.il{color:var(--tm);}
.iv{font-weight:600;}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;}
.toast.on{transform:translateY(0);opacity:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;}
.ac{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px;cursor:pointer;transition:all .15s;text-decoration:none;color:var(--t);}
.ac:hover{border-color:var(--a);}
.ai{font-size:22px;margin-bottom:8px;}
.at{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;margin-bottom:3px;}
.ad{font-size:11.5px;color:var(--tm);}
</style>
</head>
<body>

<aside class="sb">
  <div class="sb-logo">
    <div class="li">V</div>
    <div><div class="lt">Vendhan InfoTech</div><div class="ls">Employee Portal</div></div>
  </div>
  <nav class="sb-nav" id="nav"></nav>
  <div class="sb-ft">
    <div class="uc">
      <div class="ua" id="uav">?</div>
      <div><div class="un" id="unm">—</div><div class="ui" id="uid">—</div></div>
    </div>
  </div>
</aside>

<div class="wrap">
  <header class="tb">
    <div><div class="tt" id="ttl">Dashboard</div><div class="ts" id="tst">Employee Portal</div></div>
    <button class="btn bo" onclick="logout()">🚪 Sign Out</button>
  </header>
  <main class="mn" id="mn"></main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── SESSION GUARD ─────────────────────────────────────────────────────
// Only the logged-in employee can see this page.
// If no valid session exists, redirect to login immediately.
const SK = 'vendhan_session';
let S;
try { S = JSON.parse(sessionStorage.getItem(SK)||'null'); } catch(e){ S=null; }
if (!S || S.role !== 'employee') window.location.href = '../index.html';

// ── UNIQUE EMPLOYEE KEY ───────────────────────────────────────────────
// This is the critical isolation: every localStorage key used in this portal
// is prefixed with THIS employee's unique ID.
// Employee A's keys:   vendhan_E001_attendance,  vendhan_E001_leave, ...
// Employee B's keys:   vendhan_E002_attendance,  vendhan_E002_leave, ...
// They are completely separate. Reading one never touches the other.
const EID = (S.employeeId || S.email || 'guest').toLowerCase().replace(/[^a-z0-9]+/g,'_');
const key = section => `vendhan_${EID}_${section}`;

// Simple per-employee storage helpers
const load  = k => { try{ return JSON.parse(localStorage.getItem(key(k))||'[]'); }catch(e){ return []; } };
const store = (k,v) => { try{ localStorage.setItem(key(k), JSON.stringify(v)); }catch(e){}; };

// ── SECTIONS ──────────────────────────────────────────────────────────
const SECS = [
  { id:'home',  icon:'⊞',  label:'My Dashboard',          sub:'Your personal overview' },
  { id:'att',   icon:'🕐',  label:'My Attendance',         sub:'Check in/out and history',      ei:'🕐', et:'No attendance records yet',    ed:'Your attendance history will appear here once you check in.' },
  { id:'leave', icon:'📅',  label:'My Leave',              sub:'Apply and track leave',          ei:'📅', et:'No leave requests yet',         ed:'Your leave requests and approvals will appear here.' },
  { id:'sal',   icon:'💰',  label:'My Salary',             sub:'Payslips and breakdown',         ei:'💰', et:'No payslips yet',               ed:'Payslips will appear here once admin processes payroll for you.' },
  { id:'tasks', icon:'📁',  label:'My Tasks',              sub:'Personal task board',            ei:'📁', et:'No tasks assigned yet',         ed:'Tasks assigned to you will appear here.' },
  { id:'de',    icon:'🤖',  label:'Data Entry',            sub:'Upload PDF/image or paste text' },
  { id:'chat',  icon:'💬',  label:'Chat',                  sub:'Chat with teammates and HR',     ei:'💬', et:'No conversations yet',          ed:'Start a conversation and it will appear here.' },
  { id:'notif', icon:'🔔',  label:'Notifications',         sub:'Your personal feed',             ei:'🔔', et:"You're all caught up",          ed:'New notifications for you will show up here.' },
  { id:'prof',  icon:'👤',  label:'My Profile',            sub:'Your account details' },
  { id:'set',   icon:'⚙️',  label:'Settings',              sub:'Preferences',                   ei:'⚙️', et:'Default settings active',       ed:'Your preferences will be saved here once you make changes.' },
];

// ── BUILD SIDEBAR ─────────────────────────────────────────────────────
SECS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'nb'; b.id = 'n'+s.id;
  b.innerHTML = `<span>${s.icon}</span>${s.label}`;
  b.onclick = () => show(s.id);
  document.getElementById('nav').appendChild(b);
});

// ── BUILD SECTIONS ────────────────────────────────────────────────────
SECS.forEach(s => {
  const d = document.createElement('div');
  d.className = 'sec'; d.id = 's'+s.id;
  if (s.id === 'home')  d.innerHTML = homeHTML();
  else if (s.id === 'de')   d.innerHTML = deHTML();
  else if (s.id === 'prof') d.innerHTML = profHTML();
  else d.innerHTML = `<div class="em"><div class="ei">${s.ei}</div><div class="et">${s.et}</div><div class="ed">${s.ed}</div></div>`;
  document.getElementById('mn').appendChild(d);
});

// ── SIDEBAR USER INFO ─────────────────────────────────────────────────
const nm = S.name||'Employee';
const av = nm.split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase()||'?';
document.getElementById('uav').textContent = av;
document.getElementById('unm').textContent = nm;
document.getElementById('uid').textContent = S.employeeId||'';

// ── SWITCH SECTION ────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  document.getElementById('s'+id).classList.add('on');
  document.getElementById('n'+id).classList.add('on');
  const s = SECS.find(x=>x.id===id);
  document.getElementById('ttl').textContent = s.icon+' '+s.label;
  document.getElementById('tst').textContent = s.sub;
  if (id==='de') renderSubs();
}

// ── HOME SECTION ──────────────────────────────────────────────────────
function homeHTML() {
  return `
    <div style="background:linear-gradient(135deg,#4f46e5,#6366f1);border-radius:16px;padding:26px;color:#fff;margin-bottom:20px;">
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:21px;font-weight:700;margin-bottom:4px;">Welcome, ${nm.split(' ')[0]}! 👋</div>
      <div style="font-size:13px;opacity:.8;">Your personal portal — completely separate from every other employee.</div>
    </div>
    <div class="grid2">
      ${SECS.filter(s=>s.id!=='home').map(s=>`
        <div class="ac" onclick="show('${s.id}')">
          <div class="ai">${s.icon}</div>
          <div class="at">${s.label}</div>
          <div class="ad">${s.sub}</div>
        </div>`).join('')}
    </div>`;
}

// ── PROFILE SECTION ───────────────────────────────────────────────────
function profHTML() {
  return `
    <div class="card" style="max-width:500px;">
      <div class="ct">👤 My Profile</div>
      <div class="ir"><span class="il">Full Name</span><span class="iv">${S.name||'—'}</span></div>
      <div class="ir"><span class="il">Employee ID</span><span class="iv">${S.employeeId||'—'}</span></div>
      <div class="ir"><span class="il">Login Email</span><span class="iv">${S.email||'—'}</span></div>
      <div class="ir"><span class="il">Portal Role</span><span class="iv">🧑‍💼 Employee</span></div>
      <div class="ir"><span class="il">Logged in at</span><span class="iv">${S.loggedInAt?new Date(S.loggedInAt).toLocaleString('en-IN'):'—'}</span></div>
    </div>
    <div class="em" style="margin-top:16px;">
      <div class="ei">✏️</div>
      <div class="et">Edit profile coming soon</div>
      <div class="ed">Personal details, bank info and password change will be added here.</div>
    </div>`;
}

// ── DATA ENTRY SECTION ────────────────────────────────────────────────
function deHTML() {
  return `
    <div class="card">
      <div class="ct">📥 Input Source</div>
      <div class="tabs">
        <button class="tab on" onclick="swTab('pdf',this)">📄 PDF</button>
        <button class="tab" onclick="swTab('img',this)">🖼️ Image</button>
        <button class="tab" onclick="swTab('txt',this)">✍️ Paste Text</button>
      </div>
      <div class="pnl on" id="pp-pdf">
        <div class="dz" id="pdz" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="drop(event,'pdf')">
          <input type="file" accept=".pdf" onchange="pick(event,'pdf')">
          <div style="font-size:30px;margin-bottom:8px;">📄</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;margin-bottom:4px;">Drop PDF or click to browse</div>
          <div style="font-size:12px;color:var(--tm);">Text extracted directly from file</div>
        </div>
        <div class="fc" id="pfc">📄 <span id="pfct"></span></div>
      </div>
      <div class="pnl" id="pp-img">
        <div class="dz" id="idz" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="drop(event,'img')">
          <input type="file" accept="image/*" onchange="pick(event,'img')">
          <div style="font-size:30px;margin-bottom:8px;">🖼️</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;margin-bottom:4px;">Drop image or click to browse</div>
          <div style="font-size:12px;color:var(--tm);">OCR reads text from photo (10–20 sec)</div>
        </div>
        <img id="iprev" class="ip">
      </div>
      <div class="pnl" id="pp-txt">
        <textarea class="pt" id="ptxt" placeholder="Paste newspaper or article text here..."></textarea>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
        <button class="btn bp" id="exBtn" onclick="extr()">🤖 Extract Fields</button>
        <span style="font-size:12px;color:var(--tm);">Reads actual file content</span>
      </div>
    </div>

    <div class="pc" id="pc">
      <div class="sp"></div>
      <div style="font-weight:700;margin-bottom:3px;">Processing...</div>
      <div style="font-size:12px;opacity:.75;" id="pcs">Reading...</div>
    </div>

    <div class="card" id="fc2" style="display:none;">
      <div class="ct">📝 Review &amp; Submit</div>
      <div class="fg">
        <div><div class="fl">Publication</div><input class="fi" id="fpub" placeholder="e.g. The Hindu"></div>
        <div><div class="fl">Edition / Date</div><input class="fi" id="fed" placeholder="e.g. June 2025"></div>
        <div><div class="fl">Author</div><input class="fi" id="faut" placeholder="e.g. Rajesh Kumar"></div>
        <div><div class="fl">Category</div><input class="fi" id="fcat" placeholder="e.g. National"></div>
      </div>
      <div style="margin-top:12px;"><div class="fl">Headline</div><input class="fi" id="fhl" placeholder="Headline..." style="margin-top:4px;"></div>
      <div style="margin-top:12px;"><div class="fl">Main Content</div><textarea class="fi" id="fbod" placeholder="Article body..." style="margin-top:4px;"></textarea></div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <button class="btn bs" onclick="sub()">📤 Submit to Admin</button>
        <button class="btn bo" onclick="clr()">🗑 Clear</button>
      </div>
    </div>

    <div class="card">
      <div class="ct">📋 My Submissions <span style="font-size:11px;font-weight:400;color:var(--tm);">(only yours — isolated from all other employees)</span></div>
      <div id="slist"><div style="font-size:13px;color:var(--tm);">No submissions yet.</div></div>
    </div>`;
}

// ── DATA ENTRY LOGIC ──────────────────────────────────────────────────
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let ct='pdf', pf=null, imf=null;

function swTab(t,btn) {
  ct=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('pp-'+t).classList.add('on');
}
function pick(e,type) {
  const f=e.target.files[0]; if(!f) return;
  if(type==='pdf'){ pf=f; document.getElementById('pfc').style.display='flex'; document.getElementById('pfct').textContent=f.name; }
  else { imf=f; const r=new FileReader(); r.onload=ev=>{const i=document.getElementById('iprev');i.src=ev.target.result;i.style.display='block';}; r.readAsDataURL(f); }
  toast('📄 '+f.name+' loaded!');
}
function drop(e,type) {
  e.preventDefault();
  document.getElementById(type==='pdf'?'pdz':'idz').classList.remove('ov');
  const f=e.dataTransfer.files[0]; if(f) pick({target:{files:[f]}},type);
}
async function extr() {
  if(ct==='pdf'&&!pf){toast('⚠️ Upload a PDF first');return;}
  if(ct==='img'&&!imf){toast('⚠️ Upload an image first');return;}
  if(ct==='txt'&&!document.getElementById('ptxt').value.trim()){toast('⚠️ Paste some text first');return;}
  document.getElementById('pc').classList.add('on');
  document.getElementById('fc2').style.display='none';
  document.getElementById('exBtn').disabled=true;
  try {
    let text='';
    if(ct==='txt'){ text=document.getElementById('ptxt').value; }
    else if(ct==='pdf'){
      document.getElementById('pcs').textContent='Reading PDF...';
      const buf=await pf.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      for(let p=1;p<=pdf.numPages;p++){
        const pg=await pdf.getPage(p);
        const tc=await pg.getTextContent();
        let ly=null,ln='';
        tc.items.forEach(it=>{ const y=it.transform[5]; if(ly!==null&&Math.abs(y-ly)>2){text+=ln.trim()+'\n';ln='';} ln+=it.str+' ';ly=y; });
        text+=ln.trim()+'\n';
      }
    } else {
      document.getElementById('pcs').textContent='Running OCR (10–20 sec)...';
      const res=await Tesseract.recognize(imf,'eng');
      text=res.data.text;
    }
    const lines=text.split('\n').filter(l=>l.trim());
    document.getElementById('fpub').value=(lines[0]||'').split('|')[0].trim();
    document.getElementById('fhl').value=lines[1]||lines[2]||'';
    let au=''; lines.forEach(l=>{if(l.toLowerCase().startsWith('by')) au=l.replace(/^by:?\s*/i,'').trim();});
    document.getElementById('faut').value=au;
    document.getElementById('fbod').value=lines.filter(l=>l.length>60).slice(0,4).join(' ').substring(0,500);
    document.getElementById('pc').classList.remove('on');
    document.getElementById('fc2').style.display='block';
    document.getElementById('exBtn').disabled=false;
    toast('✅ Fields extracted!');
  } catch(e) {
    document.getElementById('pc').classList.remove('on');
    document.getElementById('exBtn').disabled=false;
    toast('⚠️ '+e.message);
  }
}
function sub() {
  const hl=document.getElementById('fhl').value.trim();
  if(!hl){toast('⚠️ Headline required');return;}
  // Saves ONLY under this employee's unique key — never touches any other employee's data
  const recs=load('data_entry');
  recs.unshift({
    id:'r_'+Date.now(),
    headline:hl,
    publication:document.getElementById('fpub').value,
    author:document.getElementById('faut').value,
    category:document.getElementById('fcat').value||'General',
    body:document.getElementById('fbod').value,
    submittedBy:S.name||S.email,
    employeeId:S.employeeId,
    status:'Pending',
    savedAt:new Date().toLocaleString('en-IN')
  });
  store('data_entry',recs);
  clr(); renderSubs();
  toast('✅ Submitted to admin!');
}
function clr() {
  ['fpub','fed','faut','fcat','fhl','fbod'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('fc2').style.display='none';
}
function renderSubs() {
  const el=document.getElementById('slist'); if(!el) return;
  const recs=load('data_entry');
  if(!recs.length){ el.innerHTML='<div style="font-size:13px;color:var(--tm);">No submissions yet.</div>'; return; }
  el.innerHTML=recs.map(r=>`
    <div class="sr">
      <div><div style="font-weight:600;">${r.headline}</div><div style="font-size:11px;color:var(--tm);">${r.publication||'—'} · ${r.savedAt}</div></div>
      <span class="pl ${r.status==='Reviewed'?'pr':'pp'}">${r.status==='Reviewed'?'✅ Reviewed':'⏳ Pending'}</span>
    </div>`).join('');
}

// ── TOAST & LOGOUT ────────────────────────────────────────────────────
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}
function logout(){sessionStorage.removeItem(SK);window.location.href='../index.html';}

// ── START ─────────────────────────────────────────────────────────────
show('home');
</script>
</body>
</html>
