<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Admin Account — Vendhan InfoTech</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4f46e5;--accent-light:#eef2ff;
    --surface:#fff;--bg:#f4f6fb;--border:#e5e7eb;
    --text-primary:#111827;--text-secondary:#6b7280;--text-muted:#9ca3af;
    --danger:#dc2626;--danger-bg:#fef2f2;
    --success:#059669;--success-bg:#ecfdf5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:440px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.06);}
  .icon-badge{width:52px;height:52px;border-radius:14px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px;}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;}
  .sub{font-size:13.5px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5;}

  .form-group{margin-bottom:16px;}
  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;}
  .input-wrap{position:relative;}
  input[type=email],input[type=password],input[type=text]{width:100%;height:44px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
  .toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-muted);}

  .error-box{background:var(--danger-bg);border:1px solid #fecaca;border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--danger);margin-bottom:16px;display:none;}
  .error-box.show{display:block;}
  .success-box{background:var(--success-bg);border:1px solid #a7f3d0;border-radius:10px;padding:14px;font-size:13px;color:var(--success);margin-bottom:16px;display:none;line-height:1.6;}
  .success-box.show{display:block;}
  .success-box code{background:#fff;border:1px solid #a7f3d0;border-radius:5px;padding:1px 7px;font-weight:700;}

  .btn-submit{width:100%;height:46px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;}
  .btn-submit:hover{background:#4338ca;}
  .btn-submit:disabled{opacity:.55;cursor:not-allowed;}

  .existing-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12.5px;color:var(--text-secondary);margin-top:18px;line-height:1.7;}
  .existing-box .email-chip{display:inline-block;background:#fff;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-family:monospace;margin:2px 0;}

  .login-link{text-align:center;margin-top:18px;font-size:12.5px;color:var(--text-muted);}
  .login-link a{color:var(--accent);text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div class="card">
  <div class="icon-badge">🔑</div>
  <h1>Create Admin Account</h1>
  <div class="sub">One-time setup page — registers an admin login that the <strong>Admin</strong> tab on the sign-in page will recognize.</div>

  <div class="error-box" id="errorBox"></div>
  <div class="success-box" id="successBox"></div>

  <form id="adminForm" onsubmit="handleCreate(event)">
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="adminName" placeholder="e.g. Admin User" value="Admin User" required>
    </div>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@vendhan.com" value="admin@vendhan.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="adminPassword" placeholder="At least 8 characters" required>
        <button type="button" class="toggle-pass" onclick="toggleField('adminPassword', this)">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="adminPasswordConfirm" placeholder="Re-enter password" required>
        <button type="button" class="toggle-pass" onclick="toggleField('adminPasswordConfirm', this)">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Create Admin Account</button>
  </form>

  <div class="existing-box" id="existingBox" style="display:none;"></div>

  <div class="login-link">Already created it? <a href="../index.html">Go to Sign In →</a></div>
</div>

<script>
const ADMIN_CREDENTIALS_KEY = 'vendhan_admin_credentials';

function readAdmins() {
  try { return JSON.parse(localStorage.getItem(ADMIN_CREDENTIALS_KEY) || '{}'); } catch (e) { return {}; }
}
function writeAdmins(obj) {
  try { localStorage.setItem(ADMIN_CREDENTIALS_KEY, JSON.stringify(obj)); } catch (e) {}
}

function toggleField(id, btn) {
  const field = document.getElementById(id);
  field.type = field.type === 'password' ? 'text' : 'password';
  btn.textContent = field.type === 'password' ? '👁' : '🙈';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠️ ' + msg;
  box.classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

function renderExisting() {
  const admins = readAdmins();
  const emails = Object.keys(admins);
  const box = document.getElementById('existingBox');
  if (emails.length === 0) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  box.innerHTML = '<strong>Existing admin accounts:</strong><br>' +
    emails.map(e => '<span class="email-chip">' + e + '</span>').join(' ');
}
renderExisting();

function handleCreate(event) {
  event.preventDefault();
  hideError();
  document.getElementById('successBox').classList.remove('show');

  const name = document.getElementById('adminName').value.trim();
  const email = document.getElementById('adminEmail').value.trim().toLowerCase();
  const password = document.getElementById('adminPassword').value;
  const confirm = document.getElementById('adminPasswordConfirm').value;

  if (!name || !email) { showError('Please fill in name and email.'); return; }
  if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
  if (password !== confirm) { showError('Passwords do not match.'); return; }

  const admins = readAdmins();
  if (admins[email]) {
    showError('An admin account with this email already exists. Use a different email, or go sign in.');
    return;
  }

  admins[email] = {
    password, // demo-only plaintext storage, same caveat as employee credentials
    name,
    role: 'Super Administrator',
    createdAt: new Date().toISOString()
  };
  writeAdmins(admins);

  document.getElementById('successBox').innerHTML =
    '✅ Admin account created!<br>Email: <code>' + email + '</code><br>You can now sign in from the Admin tab on the login page.';
  document.getElementById('successBox').classList.add('show');
  document.getElementById('adminForm').reset();
  document.getElementById('adminName').value = 'Admin User';
  renderExisting();
}
</script>
</body>
</html>
